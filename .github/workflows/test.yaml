name: Test

on:
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install uv
        shell: bash
        env:
          UV_VERSION: 0.7.21
        run: pip install uv==$UV_VERSION

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        env:
          CI: true
        run: make lint

      - name: Test
        env:
          CI: true
        run: make test
