[project]
name = "dbd"
version = "0.1.0"
description = "Simple (database) deployment tool"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "David Benedeki", email = "david.benedeki@welligence.com" }]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0",
    "pytest-cov>=2.12.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3>=1.43.102",
    "boto3-stubs>=1.43.102",
]

aws = [
    "boto3>=1.43.102",
]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]  # pycodestyle, pyflakes, warnings, isort, pep8-utils, pyupgrade

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = false
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
pythonpath = ["src"]
